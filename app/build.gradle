plugins { 
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android { namespace 'com.probiotics.xiaoni'; compileSdk 37
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    defaultConfig { applicationId 'com.probiotics.xiaoni'; minSdk 29; targetSdk 37; versionCode 655; versionName '3.41.25' }
    def releaseKey = file('my-release-key.jks').exists() ? file('my-release-key.jks') : file('release-keystore.jks')
    signingConfigs { release { storeFile releaseKey; storePassword 'changeit'; keyAlias 'tianming-release'; keyPassword 'changeit' } }
    signingConfigs.release {
        enableV1Signing true
        enableV2Signing true
        enableV3Signing true
    }
    // v3.41.11：启用 R8 压缩 + 资源收缩（APK 减重；17 个 DNA CLI 工具已移至云端下载）
    buildTypes { release { minifyEnabled true; shrinkResources true; signingConfig signingConfigs.release; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
    buildFeatures { aidl true; buildConfig true }
    packagingOptions { jniLibs { useLegacyPackaging true } }
    sourceSets {
        main {
            // 小米设备清单已全面改为在线自动获取（HyperOS.fans / HyperData），不再内置 TXT 资源
            assets.srcDirs += ["$buildDir/generated/vivoAssets"]
        }
    }
    def copyVivoCatalog = tasks.register('copyVivoCatalog') {
        outputs.file("$buildDir/generated/vivoAssets/vivo_devices.txt")
        doLast {
            def output = file("$buildDir/generated/vivoAssets")
            output.mkdirs()
            copy {
                from '../vivo设备清单.txt'
                into output
                rename { 'vivo_devices.txt' }
            }
        }
    }
    tasks.matching { it.name.startsWith('pre') && it.name.endsWith('Build') }.configureEach {
        dependsOn copyVivoCatalog
    }
    lint { checkReleaseBuilds false; abortOnError false }
}

dependencies {
    implementation 'com.github.topjohnwu.libsu:core:6.0.0'
    implementation 'com.github.topjohnwu.libsu:service:6.0.0'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'org.tukaani:xz:1.10'
    implementation 'com.termux.termux-app:terminal-view:0.118.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'org.apache.commons:commons-lang3:3.14.0'
}
