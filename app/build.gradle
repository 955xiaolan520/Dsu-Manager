plugins { id 'com.android.application' }

android { namespace 'com.probiotics.xiaoni'; compileSdk 37
    defaultConfig { applicationId 'com.probiotics.xiaoni'; minSdk 29; targetSdk 37; versionCode 362; versionName '3.5.12' }
    signingConfigs { release { storeFile file('release-keystore.jks'); storePassword 'changeit'; keyAlias 'tianming-release'; keyPassword 'changeit' } }
    signingConfigs.release {
        enableV1Signing true
        enableV2Signing true
        enableV3Signing true
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
    buildFeatures { aidl true; buildConfig true }
    packagingOptions { jniLibs { useLegacyPackaging true } }
    sourceSets {
        main {
            res.srcDirs += ["$buildDir/generated/xiaomiRes"]
            assets.srcDirs += ["$buildDir/generated/vivoAssets"]
        }
    }
    def copyXiaomiCatalog = tasks.register('copyXiaomiCatalog') {
        outputs.file("$buildDir/generated/xiaomiRes/raw/xiaomi_devices.txt")
        doLast {
            def output = file("$buildDir/generated/xiaomiRes")
            output.mkdirs()
            copy {
                from '../小米系统的设备.txt'
                into "$buildDir/generated/xiaomiRes/raw"
                rename { 'xiaomi_devices.txt' }
            }
        }
    }
    tasks.matching { it.name.startsWith('generate') && it.name.endsWith('Resources') }.configureEach {
        dependsOn copyXiaomiCatalog
    }
    tasks.matching { it.name.startsWith('map') && it.name.endsWith('SourceSetPaths') }.configureEach {
        dependsOn copyXiaomiCatalog
    }
    def copyVivoCatalog = tasks.register('copyVivoCatalog') {
        outputs.file("$buildDir/generated/vivoAssets/vivo_devices.txt")
        doLast {
            def output = file("$buildDir/generated/vivoAssets")
            output.mkdirs()
            copy {
                from '../vivo设备清单.txt'
                into output
                rename { 'vivo_devices.txt' }
            }
        }
    }
    tasks.matching { it.name.startsWith('pre') && it.name.endsWith('Build') }.configureEach {
        dependsOn copyVivoCatalog
    }
    lint { checkReleaseBuilds false; abortOnError false }
}

dependencies {
    implementation 'com.github.topjohnwu.libsu:core:6.0.0'
    implementation 'com.github.topjohnwu.libsu:service:6.0.0'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'org.tukaani:xz:1.10'
    implementation 'com.termux.termux-app:terminal-view:0.118.0'
}
